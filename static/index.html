<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="사진 속 대표 색상을 추출하는 로컬 웹앱" />
    <title>색감 추출기 | 이미지 대표 색상</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">LOCAL COLOR TOOL</p>
        <h1 id="page-title">사진의 색감을<br />한눈에 꺼내보세요.</h1>
        <p class="intro">사진을 올리면 대표 색상 5개와 HEX 코드를 바로 보여드립니다.</p>
        <p id="versionBadge" class="version-badge" aria-live="polite">버전 확인 중…</p>
      </section>

      <section class="workspace" aria-label="이미지 색상 추출">
        <div class="upload-panel">
          <label class="drop-zone" id="dropZone" for="fileInput">
            <span class="upload-icon" aria-hidden="true">↑</span>
            <span class="upload-title">사진을 끌어 놓거나 클릭해 선택하세요</span>
            <span class="upload-hint">JPG, PNG, WEBP, GIF · 최대 10MB</span>
          </label>
          <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden />
          <p id="fileName" class="file-name" aria-live="polite">선택된 파일이 없습니다.</p>
          <p id="errorMessage" class="message error" role="alert" hidden></p>
          <button id="extractButton" class="extract-button" type="button" disabled>색상 추출</button>
        </div>

        <div class="preview-panel">
          <div class="preview-empty" id="previewEmpty">
            <span aria-hidden="true">◫</span>
            <p>선택한 이미지가 여기에 표시됩니다.</p>
          </div>
          <img id="previewImage" alt="선택한 이미지 미리보기" hidden />
        </div>

        <section id="resultSection" class="result-panel" aria-labelledby="resultHeading" hidden>
          <div class="result-heading">
            <div>
              <p class="eyebrow">ANALYSIS RESULT</p>
              <h2 id="resultHeading">대표 색상 5가지</h2>
            </div>
            <p id="statusMessage" class="status" aria-live="polite"></p>
          </div>
          <div id="palette" class="palette" aria-label="추출된 색상 팔레트"></div>
          <p class="copy-help">색상 카드를 클릭하면 HEX 코드가 복사됩니다.</p>
        </section>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
