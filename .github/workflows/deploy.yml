name: Deploy Docker Hub image locally

on:
  workflow_run:
    workflows: ["Build and publish Docker image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-color-extractor-local-deployment
  cancel-in-progress: true

env:
  IMAGE_NAME: image-color-extractor
  CONTAINER_NAME: image-color-extractor
  HOST_PORT: "8000"
  CONTAINER_PORT: "8000"

jobs:
  deploy:
    # Deploy only after a successful push from this repository's default branch.
    # workflow_dispatch remains available for an explicit retry.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch
      )
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Verify Docker Engine is ready
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(2)
          do {
            docker version --format '{{.Server.Version}}' 2>$null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          throw 'Docker Engine is unavailable. Start Docker Desktop for the account running this Self-hosted Runner, then retry the deployment.'

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull, replace, and verify local service
        shell: pwsh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $image = "docker.io/$env:DOCKERHUB_USERNAME/$env:IMAGE_NAME`:latest"
          $portMapping = "$($env:HOST_PORT):$($env:CONTAINER_PORT)"
          $previousContainerId = docker ps -aq --filter "name=^/$env:CONTAINER_NAME$"
          $previousImageId = $null

          if ($previousContainerId) {
            $previousImageId = docker inspect --format '{{.Image}}' $previousContainerId
          }

          docker pull $image
          if ($LASTEXITCODE -ne 0) { throw "Unable to pull $image" }

          if ($previousContainerId) {
            docker rm -f $previousContainerId
            if ($LASTEXITCODE -ne 0) { throw "Unable to replace existing container $env:CONTAINER_NAME" }
          }

          try {
            docker run -d --name $env:CONTAINER_NAME --restart unless-stopped -p $portMapping $image
            if ($LASTEXITCODE -ne 0) { throw "Unable to start the new container from $image" }

            $endpoint = "http://127.0.0.1:$($env:HOST_PORT)/"
            $deadline = (Get-Date).AddMinutes(2)
            do {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri $endpoint -TimeoutSec 5
                if ($response.StatusCode -eq 200) {
                  Write-Host "Deployment succeeded: $endpoint"
                  exit 0
                }
              } catch {
                Start-Sleep -Seconds 3
              }
            } while ((Get-Date) -lt $deadline)
            throw "The new container did not return HTTP 200 at $endpoint"
          } catch {
            $failure = $_
            docker logs $env:CONTAINER_NAME 2>$null
            docker rm -f $env:CONTAINER_NAME 2>$null

            # Restore the former image if the replacement cannot serve traffic.
            if ($previousImageId) {
              Write-Warning "Restoring the previous image after failed deployment."
              docker run -d --name $env:CONTAINER_NAME --restart unless-stopped -p $portMapping $previousImageId
            }
            throw $failure
          }
