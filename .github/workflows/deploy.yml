name: Deploy Docker Hub image locally

on:
  workflow_run:
    workflows: ["Build and publish Docker image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-color-extractor-local-deployment
  cancel-in-progress: true

env:
  IMAGE_NAME: image-color-extractor
  CONTAINER_NAME: image-color-extractor
  HOST_PORT: "8000"
  CONTAINER_PORT: "8000"
  SERVICE_URL: http://127.0.0.1:8000
  DEPLOY_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch
      )
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Check out deployment source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_VERSION }}

      - name: Initialize deployment evidence paths
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $artifactDirectory = Join-Path $env:RUNNER_TEMP "image-color-extractor-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          @(
            "ARTIFACT_DIR=$artifactDirectory"
            "MONITOR_LOG=$(Join-Path $artifactDirectory 'service-monitor.csv')"
            "MONITOR_PHASE=$(Join-Path $artifactDirectory 'monitor-phase.txt')"
            "MONITOR_STOP=$(Join-Path $artifactDirectory 'monitor.stop')"
            "DEPLOYMENT_METADATA=$(Join-Path $artifactDirectory 'deployment-metadata.json')"
            "FUNCTIONAL_RESULTS=$(Join-Path $artifactDirectory 'functional-tests.json')"
            "DEPLOYMENT_SUMMARY=$(Join-Path $artifactDirectory 'summary.md')"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append

      - name: Verify Docker Engine is ready
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $deadline = (Get-Date).AddMinutes(2)
          do {
            docker version --format '{{.Server.Version}}' 2>$null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          throw 'Docker Engine is unavailable. Start Docker Desktop for the account running this Self-hosted Runner, then retry the deployment.'

      - name: Start independent service monitor
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          New-Item -ItemType Directory -Path $env:ARTIFACT_DIR -Force | Out-Null
          'before' | Set-Content -LiteralPath $env:MONITOR_PHASE -Encoding UTF8

          $baseline = Invoke-WebRequest -UseBasicParsing -Uri "$env:SERVICE_URL/" -TimeoutSec 5
          if ($baseline.StatusCode -ne 200) { throw "Baseline service returned HTTP $($baseline.StatusCode)" }

          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'scripts\monitor-service.ps1'
          $arguments = @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', "`"$scriptPath`"",
            '-Url', "`"$env:SERVICE_URL/`"",
            '-LogPath', "`"$env:MONITOR_LOG`"",
            '-PhasePath', "`"$env:MONITOR_PHASE`"",
            '-StopPath', "`"$env:MONITOR_STOP`"",
            '-RequestIntervalSeconds', '1'
          )
          $monitor = Start-Process -FilePath 'powershell.exe' -ArgumentList $arguments -WindowStyle Hidden -PassThru
          "MONITOR_PID=$($monitor.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append

          Start-Sleep -Seconds 3
          if ($monitor.HasExited) { throw 'Independent service monitor exited before deployment.' }
          $firstRecord = Import-Csv -LiteralPath $env:MONITOR_LOG | Select-Object -First 1
          if (-not $firstRecord -or $firstRecord.http_status -ne '200') {
            throw 'Independent service monitor did not record a successful baseline response.'
          }
          Write-Host "Baseline recorded: HTTP $($firstRecord.http_status), version=$($firstRecord.version)"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and replace local service
        id: deploy
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          $image = "docker.io/$env:DOCKERHUB_USERNAME/$env:IMAGE_NAME`:latest"
          $portMapping = "$($env:HOST_PORT):$($env:CONTAINER_PORT)"
          $startedAt = [DateTimeOffset]::UtcNow
          $previousContainerId = docker ps -aq --filter "name=^/$env:CONTAINER_NAME$"
          $previousImageId = $null
          $newImageId = $null
          $repoDigest = $null
          $result = 'failed'
          $deploymentError = $null

          if ($previousContainerId) {
            $previousImageId = docker inspect --format '{{.Image}}' $previousContainerId
          }
          'deploying' | Set-Content -LiteralPath $env:MONITOR_PHASE -Encoding UTF8

          try {
            docker pull $image
            if ($LASTEXITCODE -ne 0) { throw "Unable to pull $image" }
            $newImageId = docker image inspect --format '{{.Id}}' $image
            $repoDigest = docker image inspect --format '{{index .RepoDigests 0}}' $image

            if ($previousContainerId) {
              docker rm -f $previousContainerId
              if ($LASTEXITCODE -ne 0) { throw "Unable to replace existing container $env:CONTAINER_NAME" }
            }

            docker run -d --name $env:CONTAINER_NAME --restart unless-stopped -p $portMapping `
              -e "APP_VERSION=$env:DEPLOY_VERSION" `
              --label "org.opencontainers.image.revision=$env:DEPLOY_VERSION" `
              $image
            if ($LASTEXITCODE -ne 0) { throw "Unable to start the new container from $image" }

            $deadline = (Get-Date).AddMinutes(2)
            do {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "$env:SERVICE_URL/api/health" -TimeoutSec 5
                $health = $response.Content | ConvertFrom-Json
                if ($response.StatusCode -eq 200 -and $health.version -eq $env:DEPLOY_VERSION) {
                  $result = 'success'
                  'after' | Set-Content -LiteralPath $env:MONITOR_PHASE -Encoding UTF8
                  Write-Host "Deployment succeeded: $env:SERVICE_URL, version=$($health.version)"
                  break
                }
              } catch {
                Start-Sleep -Seconds 3
              }
            } while ((Get-Date) -lt $deadline)
            if ($result -ne 'success') { throw 'The new container did not report the expected version within two minutes.' }
          } catch {
            $deploymentError = $_.Exception.Message
            'rollback' | Set-Content -LiteralPath $env:MONITOR_PHASE -Encoding UTF8
            docker logs $env:CONTAINER_NAME 2>$null
            docker rm -f $env:CONTAINER_NAME 2>$null
            if ($previousImageId) {
              Write-Warning 'Restoring the previous image after failed deployment.'
              docker run -d --name $env:CONTAINER_NAME --restart unless-stopped -p $portMapping $previousImageId
            }
          } finally {
            $metadata = [ordered]@{
              service_url = $env:SERVICE_URL
              deploy_version = $env:DEPLOY_VERSION
              image = $image
              previous_container_id = $previousContainerId
              previous_image_id = $previousImageId
              new_container_id = (docker ps -aq --filter "name=^/$env:CONTAINER_NAME$")
              new_image_id = $newImageId
              repo_digest = $repoDigest
              started_utc = $startedAt.ToString('o')
              ended_utc = [DateTimeOffset]::UtcNow.ToString('o')
              result = $result
              error = $deploymentError
            }
            $metadata | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $env:DEPLOYMENT_METADATA -Encoding UTF8
          }
          if ($deploymentError) { throw $deploymentError }

      - name: Verify color extraction and UI improvement
        id: functional
        if: steps.deploy.outcome == 'success'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $testImage = Join-Path $env:RUNNER_TEMP 'solid-red.png'
          python -c "from PIL import Image; Image.new('RGB',(64,64),(255,0,0)).save(r'$testImage')"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create the solid-color PNG fixture.' }

          $curlOutput = @(curl.exe -sS -w "`n%{http_code}" -F "file=@$testImage;type=image/png" "$env:SERVICE_URL/api/extract")
          if ($LASTEXITCODE -ne 0 -or $curlOutput.Count -lt 2) { throw 'Color extraction request failed.' }
          $httpStatus = [int]$curlOutput[-1]
          $body = ($curlOutput[0..($curlOutput.Count - 2)] -join "`n") | ConvertFrom-Json
          $extractedHex = [string]$body.colors[0].hex

          $healthResponse = Invoke-WebRequest -UseBasicParsing -Uri "$env:SERVICE_URL/api/health" -TimeoutSec 5
          $health = $healthResponse.Content | ConvertFrom-Json
          $scriptResponse = Invoke-WebRequest -UseBasicParsing -Uri "$env:SERVICE_URL/static/app.js" -TimeoutSec 5
          $copyMessagePass = $scriptResponse.Content -match '\$\{hex\} 복사 완료'
          $colorPass = $httpStatus -eq 200 -and $extractedHex -eq '#FF0000'
          $healthPass = $healthResponse.StatusCode -eq 200 -and $health.version -eq $env:DEPLOY_VERSION

          $functional = [ordered]@{
            expected_hex = '#FF0000'
            extracted_hex = $extractedHex
            color_extract_http_status = $httpStatus
            color_test_passed = $colorPass
            expected_copy_message = '#FF0000 복사 완료'
            copy_message_asset_passed = $copyMessagePass
            health_http_status = [int]$healthResponse.StatusCode
            health_version = [string]$health.version
            health_test_passed = $healthPass
          }
          $functional | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $env:FUNCTIONAL_RESULTS -Encoding UTF8
          if (-not $colorPass -or -not $copyMessagePass -or -not $healthPass) {
            throw 'One or more post-deployment functional checks failed.'
          }

      - name: Continue post-deployment observation
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $seconds = if ('${{ steps.deploy.outcome }}' -eq 'success') { 30 } else { 5 }
          Write-Host "Continuing independent monitoring for $seconds seconds."
          Start-Sleep -Seconds $seconds

      - name: Stop monitor and collect UTF-8 logs
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          New-Item -ItemType Directory -Path $env:ARTIFACT_DIR -Force | Out-Null
          New-Item -ItemType File -Path $env:MONITOR_STOP -Force | Out-Null
          if ($env:MONITOR_PID) {
            $monitor = Get-Process -Id ([int]$env:MONITOR_PID) -ErrorAction SilentlyContinue
            if ($monitor) {
              $null = $monitor.WaitForExit(15000)
              if (Get-Process -Id $monitor.Id -ErrorAction SilentlyContinue) {
                Stop-Process -Id $monitor.Id -Force
              }
            }
          }
          $containerLog = Join-Path $env:ARTIFACT_DIR 'container.log'
          $previousErrorPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $containerOutput = @(docker logs $env:CONTAINER_NAME 2>&1)
            $dockerLogExitCode = $LASTEXITCODE
          } finally {
            $ErrorActionPreference = $previousErrorPreference
          }
          $containerOutput | ForEach-Object { "$_" } | Out-File -LiteralPath $containerLog -Encoding UTF8
          if ($dockerLogExitCode -ne 0) {
            Write-Warning "docker logs exited with code $dockerLogExitCode; captured output was still saved."
          }

      - name: Create deployment summary
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\summarize-deployment.ps1" `
            -MonitorLogPath $env:MONITOR_LOG `
            -MetadataPath $env:DEPLOYMENT_METADATA `
            -FunctionalResultPath $env:FUNCTIONAL_RESULTS `
            -SummaryPath $env:DEPLOYMENT_SUMMARY `
            -ServiceUrl $env:SERVICE_URL `
            -DeployVersion $env:DEPLOY_VERSION

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-evidence-${{ github.run_id }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 30
