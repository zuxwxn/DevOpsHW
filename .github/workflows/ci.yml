name: Build and publish Docker image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Docker repository name. The final image is
  # docker.io/<DOCKERHUB_USERNAME>/image-color-extractor.
  IMAGE_NAME: image-color-extractor

jobs:
  docker:
    name: Build${{ github.event_name == 'pull_request' && ' (PR)' || ' and publish' }}
    # Pin the runner OS instead of inheriting future ubuntu-latest migrations.
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Docker metadata
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        # Use Docker CLI's documented stdin path. This avoids the malformed
        # authorization-header failure observed with the action wrapper while
        # keeping both credentials in GitHub Secrets.
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::DOCKERHUB_USERNAME secret is missing."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::DOCKERHUB_TOKEN secret is missing."; exit 1; }
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # PR builds must not depend on repository secrets, including when
          # the pull request originates from a fork.
          tags: ${{ github.event_name == 'pull_request' && 'image-color-extractor:ci' || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
